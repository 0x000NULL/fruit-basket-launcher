name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# GitHub-hosted only: this repo is public, so it must never run on self-hosted runners.
jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }}
      - name: Build the launcher
        run: cargo build --profile dist --target ${{ matrix.target }}
      - name: Stage the package
        shell: bash
        run: |
          set -euo pipefail
          pkg="fruitbasket-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$pkg"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/dist/fruitbasket.exe" "dist/$pkg/"
          else
            cp "target/${{ matrix.target }}/dist/fruitbasket" "dist/$pkg/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$pkg/"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PKG" -DestinationPath "dist/$env:PKG.zip"
      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *.zip *.tar.gz; do
            [ -e "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes for this tag (its CHANGELOG section)
        shell: bash
        run: |
          set -euo pipefail
          awk -v tag="$GITHUB_REF_NAME" '
            /^## / { on = ($2 == tag) }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $GITHUB_REF_NAME" > notes.md; fi
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: Fruit Basket launcher ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
