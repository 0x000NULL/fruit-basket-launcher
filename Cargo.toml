[package]
name = "fruitbasket"
version = "1.3.0"
edition = "2024"
rust-version = "1.89"
description = "Fruit Basket launcher: the game library and the emulators, from one window"
license = "MIT"
publish = false

[dependencies]
basket-ui = { git = "https://github.com/0x000NULL/fruit-basket", tag = "v0.5.0" }
basket-app = { git = "https://github.com/0x000NULL/fruit-basket", tag = "v0.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
minisign-verify = "0.3"
sha2 = "0.11"
sha1 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
dirs = "7"
minifb = "0.29"
gilrs = "0.11"
tiny-skia = "0.12"
png = "0.18"
toml = "1"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
basket-build = { git = "https://github.com/0x000NULL/fruit-basket", tag = "v0.5.0" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"

# Shipped binaries (the release workflow builds with `--profile dist`).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
debug = false
